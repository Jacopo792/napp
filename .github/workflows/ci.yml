name: Checks

# Nothing was checking a pull request. Lint, typecheck, tests and the build all
# ran only on the way to Pages, which meant a branch could be reviewed and
# merged before anything had compiled it.
on:
  pull_request:
  push:
    branches: [main, PP]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # No Supabase variables: this proves the bundle compiles, and the archive
      # it would talk to is not this workflow's business.
      - name: Build
        run: pnpm run build
