name: Checks and deploy

# One workflow, because two could not be made to depend on each other. Lint,
# typecheck, tests and the build used to run only on the way to Pages, so a
# branch could be reviewed and merged before anything had compiled it; then
# the checks moved here and Pages was published by a workflow of its own,
# which meant a red backend job did not stop a deploy. `needs` below is the
# only way into the `deploy` job, and there is no input that skips it.
on:
  pull_request:
  push:
    branches: [main, PP]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Never cancel a run that might be publishing: on `main` this one ends at
  # Pages, and half a deploy is worse than a slow queue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format
        run: pnpm format:check

      # Placeholders, not the real project. vite.config.ts refuses to build
      # without these two, by design — a bundle that silently shipped with no
      # backend would be worse than a failed build. What this step proves is
      # that the code compiles, and it has to do that for a pull request from a
      # fork, which cannot read repository variables. The real values are set
      # in deploy.yml, and neither of them is secret in the first place.
      # Both shells, not only the one that deploys. They share a core, and a
      # change to it that breaks the desktop renderer has to fail here rather
      # than at the next release, when nobody is looking at this change any
      # more. Electron itself is not packaged — that needs a macOS and a
      # Windows runner, and it is release.yml's job.
      - name: Build the web app
        env:
          VITE_SUPABASE_URL: https://checks.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: not-a-real-key
          VITE_COLLAB_URL: wss://checks.example.invalid
        run: pnpm run build

      - name: Build the desktop renderer
        env:
          VITE_SUPABASE_URL: https://checks.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: not-a-real-key
          VITE_COLLAB_URL: wss://checks.example.invalid
          VITE_WEB_ORIGIN: https://checks.example.invalid/
        run: pnpm --filter @notes-app/desktop build:renderer

  # The desktop renderer, on Windows, and nothing else.
  #
  # `checks` above builds it on Ubuntu, which cannot see a whole class of fault:
  # a Windows path is not a POSIX one, and the tooling that reads paths quietly
  # disagrees. `apps/desktop/vite.config.ts` used `new URL(...).pathname`, which
  # on Windows is `/D:/a/repo` — a slash in front of the drive letter, which no
  # Windows API accepts — so vite-tsconfig-paths found no tsconfig, the `@` alias
  # resolved to nothing, and the Windows half of the release matrix died on
  # `Rollup failed to resolve import "@/lib/axes"`. Every check this repository
  # ran was green, because on Linux and macOS the two spellings happen to agree.
  #
  # Only the renderer: packaging is release.yml's job and takes minutes. And
  # deliberately not in `deploy`'s `needs` — a fault only Windows can see must
  # be loud, but it must not stop the website from updating.
  desktop-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop renderer
        env:
          VITE_SUPABASE_URL: https://checks.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: not-a-real-key
          VITE_COLLAB_URL: wss://checks.example.invalid
          VITE_WEB_ORIGIN: https://checks.example.invalid/
        run: pnpm --filter @notes-app/desktop build:renderer

  # The collaboration server, against a real Postgres and a real Redis. Running
  # its suite without those would let every integration test report success
  # because it skipped, which is worse than not running them: `REQUIRE_INTEGRATION`
  # turns a missing stack into a failed job rather than a quiet pass.
  backend:
    runs-on: ubuntu-latest

    services:
      # The bus between instances. Two Hocuspocus processes are started by the
      # multi-instance test and have to find each other through this.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration in `supabase/migrations/` to a fresh database,
      # which is also the dry run: a migration that cannot be applied fails the
      # job here rather than against the linked project.
      - name: Start Supabase
        run: supabase start

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the collaboration server
        env:
          REQUIRE_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6380
        run: pnpm test:server

      # The image is what Render runs, so a Dockerfile that no longer builds is
      # a broken deploy waiting for somebody to notice.
      - name: Build the collaboration server image
        run: docker build -f packages/collab-server/Dockerfile -t notes-collab:ci .

      # And a Dockerfile that builds is not a Dockerfile that runs. `COPY` is
      # happy to leave out a file the server imports; the image then builds
      # green here, deploys, and exits on ERR_MODULE_NOT_FOUND, and Render
      # keeps serving the previous instance — so the service looks healthy
      # while three days of commits are not on it. That is exactly what
      # happened when `writeLocks.ts` was added.
      #
      # Placeholders, like the frontend build above: `/healthz` is liveness and
      # asks nothing of Supabase or the bus. What this proves is that every
      # module the server imports is in the image.
      - name: Start the collaboration server image
        run: |
          docker run -d --name collab-smoke -p 8099:8080 \
            -e SUPABASE_URL=https://checks.example.invalid \
            -e SUPABASE_PUBLISHABLE_KEY=not-a-real-key \
            -e SUPABASE_SERVICE_ROLE_KEY=not-a-real-key \
            -e ALLOWED_ORIGINS=https://checks.example.invalid \
            notes-collab:ci
          for _ in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8099/healthz && exit 0
            sleep 1
          done
          echo "the image never answered /healthz:"
          docker logs collab-smoke
          exit 1

      - name: Stop the collaboration server image
        if: always()
        run: docker rm -f collab-smoke || true

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # Pages is published by a run that proved both halves and by nothing else.
  # `needs` is the whole guard: a failed frontend job or a failed
  # Supabase/Redis/Docker job leaves this one skipped, and `workflow_dispatch`
  # takes no input that could get past it.
  deploy:
    needs: [checks, backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      VITE_BASE_PATH: /note-sharing-app/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # The collaboration server on Render. Public, like the two above.
      VITE_COLLAB_URL: ${{ vars.VITE_COLLAB_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The checks job built with placeholders to prove the code compiles.
      # This is the same build against the real values and the deployed base
      # path, which is the artifact itself.
      - name: Build
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - uses: actions/deploy-pages@v4
        id: deploy

      # The collaboration server, from the run that has just proved it. Render's
      # own auto-deploy has never fired: the service was created through its API,
      # so nothing on this repository subscribes to a push — no webhook, no
      # installation. This asks for the same deploy from the one place that
      # knows the tests passed, which `On Commit` could not promise: it deploys
      # a red commit as happily as a green one.
      #
      # The hook is a URL carrying its own key, so it is a secret and never a
      # variable. Absent, this step says so and passes: a fork cannot read it,
      # and neither can a clone nobody has given it to.
      - name: Deploy the collaboration server
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set — the collaboration server was not deployed."
            exit 0
          fi
          echo "asked Render for a deploy, HTTP $(curl --fail --silent \
            --max-time 60 --request POST --output /dev/null \
            --write-out '%{http_code}' "$HOOK")"
