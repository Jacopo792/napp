<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Note</title>
    <style>
      #root {
        display: flex;
        flex-direction: column;
        background: var(--page);
      }
      /* System type, generous glyph clearance and natural word wrapping.
         The desktop's tighter display-title rules do not fit an iPhone textarea. */
      .note-title.note-title-mobile {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.02em;
        padding: 4px 2px 8px;
        box-sizing: border-box;
        hyphens: none;
        overflow-wrap: anywhere;
        -webkit-text-size-adjust: 100%;
      }
      /* Notes' page: the system face at a reading size, headings in the
         accent, nothing of the desktop's display type. */
      #root .rich-text-editor {
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 17px;
        font-weight: 400;
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
      }
      #root .rich-text-content h1,
      #root .rich-text-content h2,
      #root .rich-text-content h3 {
        font-family: -apple-system, system-ui, sans-serif;
        color: var(--accent);
        letter-spacing: -0.01em;
        margin: 0.9em 0 0.2em;
      }
      #root .rich-text-content h1 {
        font-size: 24px;
      }
      #root .rich-text-content h2 {
        font-size: 20px;
      }
      #root .rich-text-content h3 {
        font-size: 17px;
        font-weight: 600;
      }
      #root .rich-text-content p {
        margin: 0.15em 0;
      }
      .editor-scroll {
        padding-top: var(--host-top, 0px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 96px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
