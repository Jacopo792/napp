      THESIS: The note is the calmest place in the app. Familiar three-pane navigation
      stays efficient, while warm spacing and soft containment remove the rigid grid.

      DM Sans carries interface, Source Serif 4 carries long-form notes, and JetBrains
      Mono appears only for genuine measurements and save state. Soft, not ornamental.
      STORY: Jacopo switches between his and Lisa's notes in the header, collapses the
      navigation for a full writing page, and formats or imports local PDF text from one
      compact menu while the GitHub save state remains visible and honest.
      FIRST VIEWPORT: Archive identity lives in the top bar. Two elevated navigation
      panes can disappear together; the editor then expands while keeping title and body
      left-aligned on one measure. The light and dark palettes preserve a visible caret.
      FORM: soft editorial workspace; modern, clean and intentionally non-angular;
      direction seed a24bc00d.
